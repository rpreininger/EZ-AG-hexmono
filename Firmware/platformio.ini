; Firmware für den ESP32-S3.
;
;   pio run -t upload            die bisherige Box: nur der Gitarrenfilter
;   pio run -e synth -t upload   Filter + eingebauter SID-Synth mit Web-Editor
;   pio device monitor           serielle Ausgabe ansehen
;
; Die Filterlogik selbst wird ohne Board getestet, siehe `make firmware-test`.
;
; Plattform festgenagelt: 7.0.1 bringt den Arduino-Kern 2.0.17 mit, mit dem der USB-Host
; geprüft ist. Ohne Versionsangabe käme irgendwann stillschweigend Kern 3.x.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<synth/>

; Das Board ist ein N16R8-Nachbau: 16 MB Quad-Flash, 8 MB Octal-PSRAM (GPIO 35–37 belegt).
; Die Flash-Aufteilung lässt die Presets bei jedem neuen Flashen der Firmware stehen.
[env:synth]
build_src_filter = +<*> -<main.cpp>
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit seesaw Library@1.7.9
build_flags =
    ${env.build_flags}
    -O2
    -DBOARD_HAS_PSRAM
    -DRESID_ENABLE_INTERPOLATE
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
build_unflags =
    ${env.build_unflags}
    -Os

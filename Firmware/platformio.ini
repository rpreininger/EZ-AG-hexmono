; Firmware für den ESP32-S3.
;
;   pio run                  übersetzen
;   pio run -t upload        flashen
;   pio device monitor       serielle Ausgabe ansehen
;
; Die Filterlogik selbst wird ohne Board getestet, siehe `make firmware-test`.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

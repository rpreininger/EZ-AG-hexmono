; Messfirmwares für den SID-Synth auf dem ESP32-S3.
;
;   pio run -e sid-bench -t upload   CPU-Last von reSID in verschiedenen Einstellungen
;   pio run -e coexist -t upload     Klang + WLAN/Browser + USB-Host + Flash gleichzeitig
;   pio device monitor               Messwerte ansehen (UART-Port, CH340)
;
; Das Board ist ein N16R8-Nachbau: 16 MB Quad-Flash, 8 MB Octal-PSRAM (GPIO 35–37 belegt).
; Plattform festgenagelt — 7.0.1 bringt den Arduino-Kern 2.0.17 mit, eine spätere
; Version würde stillschweigend auf 3.x wechseln.

[env]
platform = espressif32@7.0.1
; reSID kommt aus der Firmware, damit es nur eine Kopie gibt.
lib_extra_dirs = ../../Firmware/lib
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DRESID_ENABLE_INTERPOLATE
build_unflags =
    -std=gnu++11
    -Os

[env:sid-bench]
build_src_filter = +<bench.cpp>

[env:coexist]
build_src_filter = +<coexist.cpp> +<firmware_glue.cpp>
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/AsyncTCP@^3.4.9
    ESP32Async/ESPAsyncWebServer@^3.12.1
build_flags =
    ${env.build_flags}
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

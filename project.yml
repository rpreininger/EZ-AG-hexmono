name: MidiFilter

options:
  bundleIdPrefix: de.ralfpreininger
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  MidiFilterCore:
    path: Packages/MidiFilterCore

targets:
  MidiFilter:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
    dependencies:
      - package: MidiFilterCore
        product: MidiFilterCore
    settings:
      base:
        PRODUCT_NAME: MidiFilter
        PRODUCT_BUNDLE_IDENTIFIER: de.ralfpreininger.MidiFilter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MidiFilter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Keeps MIDI flowing when the iOS app is in the background.
        INFOPLIST_KEY_UIBackgroundModes: audio
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"

  # Die Mac-App für Presets: übersetzt die Klangerzeugung der Box (reSID, engine_core,
  # Werksklänge, Schema, EZ-AG-Filter) und zeigt deren Web-Editor. Siehe PORTIERUNG.md.
  SIDSynth:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: SIDSynth/App
      - path: SIDSynth/Core
      - path: Firmware/lib/reSID/src
      - path: Firmware/src/synth/params.cpp
      - path: Firmware/src/synth/engine_core.cpp
      - path: Firmware/src/synth/factory.cpp
      - path: Firmware/src/midi_filter.cpp
      - path: Firmware/src/midi_event.cpp
      - path: Firmware/web/index.html
        buildPhase: resources
    info:
      path: SIDSynth/Info.plist
      properties:
        CFBundleDisplayName: SID-Synth
        LSApplicationCategoryType: public.app-category.music
        # Die Box spricht nur http:// und ws:// in ihrem eigenen WLAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Zum Holen und Übertragen der Presets über das WLAN der Box.
        # iPad und iPhone: Ton und MIDI auch im Hintergrund, ein Fenster, alle Ausrichtungen.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: SIDSynth
        PRODUCT_BUNDLE_IDENTIFIER: de.ralfpreininger.SIDSynth
        SWIFT_OBJC_BRIDGING_HEADER: SIDSynth/Core/SIDSynth-Bridging-Header.h
        HEADER_SEARCH_PATHS: >-
          $(SRCROOT)/Firmware/lib/reSID/src $(SRCROOT)/Firmware/src/synth
          $(SRCROOT)/Firmware/src $(SRCROOT)/SIDSynth/Core
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "RESID_ENABLE_INTERPOLATE"]
        # reSID muss auch im Debug-Build in Echtzeit laufen.
        GCC_OPTIMIZATION_LEVEL: "2"
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # Fürs iPad: das Entwicklerzertifikat auf diesem Mac.
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 6R26PD6ZLD
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
